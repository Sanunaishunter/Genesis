<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創世：天神模擬器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>🌋 創世 <span class="sub">天神模擬器</span></h1>
      <div id="stats">
        <span>📅 第 <b id="stat-day">0</b> 天</span>
        <span>🧑 人口 <b id="stat-pop">0</b>（<span id="stat-men">0</span>♂ / <span id="stat-women">0</span>♀ / <span id="stat-children">0</span>幼）</span>
        <span>🌳 樹木 <b id="stat-trees">0</b></span>
        <span>🐇 動物 <b id="stat-animals">0</b></span>
        <span>☀️ 天氣：<b id="stat-weather">晴朗</b></span>
      </div>
    </header>

    <main>
      <div id="canvas-wrap">
        <canvas id="world" width="864" height="576"></canvas>
        <div id="toast"></div>
      </div>

      <aside id="panel">
        <section>
          <h2>⛅ 掌控天氣</h2>
          <div class="btn-row">
            <button class="tool" data-tool="weather-sunny">☀️ 晴朗</button>
            <button class="tool" data-tool="weather-rain">🌧️ 降雨</button>
            <button class="tool" data-tool="weather-storm">⛈️ 風暴</button>
            <button class="tool" data-tool="weather-drought">🏜️ 乾旱</button>
          </div>
        </section>

        <section>
          <h2>🌱 創造生命</h2>
          <div class="btn-row">
            <button class="tool" data-tool="plant-seed">🌱 種下種子</button>
            <button class="tool" data-tool="spawn-animal">🐇 創造動物</button>
            <button class="tool" data-tool="spawn-man">🧔 創造男人</button>
            <button class="tool" data-tool="spawn-woman">👩 創造女人</button>
          </div>
          <p class="hint">選擇能力後，點擊島上的陸地即可施展。</p>
        </section>

        <section>
          <h2>⏱️ 時間流速</h2>
          <div class="btn-row">
            <button class="tool" data-tool="speed-pause">⏸ 暫停</button>
            <button class="tool" data-tool="speed-normal">▶ 正常</button>
            <button class="tool" data-tool="speed-fast">⏩ 加速</button>
          </div>
        </section>

        <section id="selected-tool-box">
          <h2>目前能力</h2>
          <p id="selected-tool-label">尚未選擇</p>
        </section>

        <section>
          <h2>📜 說明</h2>
          <p class="hint">
            一開始島上空無一物。種下種子會長成樹木並結出果實；
            創造動物與男女後，他們會自己覓食、成長、繁衍與老去。
            天氣會影響作物生長與居民的生存難度——降雨加速生長，
            乾旱使人更容易挨餓，風暴則可能摧毀幼苗。
          </p>
        </section>
      </aside>
    </main>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
